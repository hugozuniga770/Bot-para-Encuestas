name: Bot de Encuestas Aleatorias

on:
  schedule:
    # Ejecuta automáticamente todos los días a las 12:00 UTC (8:00 AM hora de Bolivia)
    - cron: '0 12 * * *' 
  workflow_dispatch: # Este comando es la magia que te permite darle al botón "Run workflow" manualmente

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar funcionAleatoria.py
        run: python funcionAleatoria.py
